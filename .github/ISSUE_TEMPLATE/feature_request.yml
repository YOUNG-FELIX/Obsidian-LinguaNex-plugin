name: 功能建议
description: 提出一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 先说清楚场景和痛点，再提方案 —— 知道"为什么"才好判断怎么做
      placeholder: 复习长单词时，卡片右上角的笔记区会和发音按钮挤在一起……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你希望怎么解决
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其他方案
      description: 有就写，没有可留空

  - type: dropdown
    id: platform
    attributes:
      label: 主要使用平台
      options:
        - 桌面端
        - 移动端
        - 两端都用
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已看过 README 与 CHANGELOG，确认这个功能目前没有
          required: false
        - label: 我愿意参与测试或协助实现
          required: false
